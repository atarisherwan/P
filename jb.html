<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jb Host | Sherwan Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-width: 350px;
            width: 80vw;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.3));
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- ناوی وێنەی لۆگۆکەت لێرە دابنە -->
        <img src="logo.png" alt="Logo">
    </div>

</body>
</html>
