<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atari Sherwan - Jailbreak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* وێنەی باکگراوندی دووکانەکەت */
            background-image: url('image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            
            /* تۆخکردنەوەی پاشبنەما بۆ ئەوەی دەقەکان بە جوانی دیار بن */
            background-color: rgba(11, 15, 25, 0.75);
            background-blend-mode: overlay;
        }
        #msgs {
            font-size: 20px;
            color: #00d2ff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="msgs">Initializing Exploit...</div>

    <script src="core.js"></script>
    <script src="int64.js"></script>
    <script src="mem.js"></script>
    <script src="ps4_offsets.js"></script>
    <script src="jb.js"></script>
    <script>
        // فەنکشنی سەرکەوتنی جیلبرێک و ناردنی GoldHEN
        function all_done() {
            document.getElementById("msgs").innerText = "Jailbreak Successful! Loading GoldHEN...";
            setTimeout(function() {
                read_payload();
            }, 500);
        }

        function read_payload() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'goldhen.bin', true);
            xhr.binaryType = "arraybuffer";
            xhr.onload = function (e) {
                var payload = xhr.response;
                send_payload(window.location.hostname, 9020, payload, function() {
                    document.getElementById("msgs").innerText = "GoldHEN Activated Successfully!";
                });
            };
            xhr.send();
        }

        window.addEventListener('load', function () {
            setTimeout(function () {
                if (typeof run_jb === 'function') {
                    run_jb();
                } else {
                    document.getElementById("msgs").innerText = "Ready. Tap to run jailbreak.";
                }
            }, 500);
        });
    </script>
</body>
</html>
