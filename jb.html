<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atari Sherwan - PS4 Jailbreak</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background-image: url('image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgba(11, 15, 25, 0.82);
            background-blend-mode: overlay;
        }
        h2 { 
            font-size: 32px; 
            margin-bottom: 15px; 
            color: #fff; 
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
        }
        #msgs {
            font-size: 20px;
            color: #00d2ff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }
    </style>
    <script src="core.js"></script>
    <script src="int64.js"></script>
    <script src="mem.js"></script>
    <script src="ps4_offsets.js"></script>
    <script src="jb.js"></script>
</head>
<body>
    <h2>ئـاتاری شێروان - Sherwan Center</h2>
    <div id="msgs">Initializing Jailbreak... Please Wait...</div>

    <script>
        // کاتێک هاکەکە سەرکەوتوو دەبێت، ئەم فەنکشنە بانگ دەکرێت
        function all_done() {
            document.getElementById("msgs.innerHTML = "Jailbreak Successful! Loading GoldHEN...";
            setTimeout(function() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'goldhen.bin', true);
                xhr.binaryType = "arraybuffer";
                xhr.onload = function () {
                    var payload = xhr.response;
                    if (typeof send_payload === "function") {
                        send_payload(window.location.hostname, 9020, payload, function() {
                            document.getElementById("msgs").innerHTML = "GoldHEN Activated Successfully!";
                        });
                    } else {
                        document.getElementById("msgs").innerHTML = "GoldHEN Loaded! Check your settings.";
                    }
                };
                xhr.send();
            }, 1000);
        }

        // دەستپێکردنی ئۆتۆماتیکی پاش ١.٥ چرکە
        window.onload = function() {
            setTimeout(function() {
                if (typeof run_jb === 'function') {
                    run_jb();
                } else {
                    document.getElementById("msgs").innerHTML = "Error: Exploit scripts failed to load!";
                }
            }, 1500);
        };
    </script>
</body>
</html>
