<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atari Sherwan</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-image: url('image.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-color: rgba(11, 15, 25, 0.85);
        background-blend-mode: overlay;
        color: #c8ced8;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      #brand {
        text-align: center;
        padding: 25px 10px 15px 10px;
        background: transparent;
      }
      #brand b {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #ffffff;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        display: block;
      }
      #tiktok-sub {
        font-size: 14px;
        color: #00d2ff;
        margin-top: 6px;
        letter-spacing: 1.5px;
        font-weight: 600;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      }
      #spin {
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #msg {
        position: fixed;
        top: calc(50% - 10px);
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #00d2ff;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>Atari Sherwan</b>
      <div id="tiktok-sub">TikTok/@Atari.Sherwan</div>
    </div>
    <div id="spin"></div>
    <div id="msg">Initializing Exploit...</div>

    <!-- بارکردنی فایلە بنەڕەتییەکان یەک بە دوای یەک بە شێوەیەکی پارێزراو -->
    <script src="int64.js"></script>
    <script src="rop.js" onerror="console.log('rop optional')"></script>
    <script src="core.js"></script>
    <script src="mem.js"></script>
    <script src="jb.js"></script>

    <script>
      window.addEventListener('error', function(e) {
          document.getElementById("msg").textContent = "Error: " + e.message;
          document.getElementById("spin").style.display = "none";
      });

      setTimeout(function() {
          if(document.getElementById("msg").textContent === "Initializing Exploit...") {
              document.getElementById("msg").textContent = "Jailbreak Triggered / Ready";
          }
      }, 3000);
    </script>
  </body>
</html>
