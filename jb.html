<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atari Sherwan</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-image: url('image.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-color: rgba(11, 15, 25, 0.85);
        background-blend-mode: overlay;
        color: #c8ced8;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      #brand {
        text-align: center;
        padding: 25px 10px 15px 10px;
        background: transparent;
      }
      #brand b {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #ffffff;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        display: block;
      }
      #tiktok-sub {
        font-size: 14px;
        color: #00d2ff;
        margin-top: 6px;
        letter-spacing: 1.5px;
        font-weight: 600;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      }

      #spin {
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: calc(50% - 10px);
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #00d2ff;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: #d08a7f;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: rgba(17, 21, 27, 0.9);
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>Atari Sherwan</b>
      <div id="tiktok-sub">TikTok/@Atari.Sherwan</div>
    </div>
    <div id="spin"></div>
    <div id="msg">Loading Jailbreak...</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script>
      var uaFull = navigator.userAgent;
      var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
      var isPS4 = match !== null;
      var fwVersion = isPS4 ? match[1] : "Unknown";
      var fwNum = parseFloat(fwVersion);

      function onScriptError() {
          document.getElementById("msg").textContent = "Script Error! Check File Paths";
          document.body.className = "fail";
      }

      if (isPS4) {
          var script = document.createElement('script');
          script.onerror = onScriptError;

          // لێرەدا دەتوانیت ڕاستەوخۆ فایلە سەرەکییەکەی خۆت بکەیتە سەرچاوە
          script.src = "jb.js?v=19"; 
          
          script.onload = function () {
              setTimeout(function () { 
                  if (typeof doJb === 'function') {
                      doJb(); 
                  } else {
                      document.getElementById("msg").textContent = "Jailbreak Ready";
                      document.body.className = "done";
                  }
              }, 500);
          };

          document.head.appendChild(script);
      } else {
          document.getElementById("msg").textContent = "Not a PS4 Browser";
          document.body.className = "fail";
      }
    </script>
  </body>
</html>
