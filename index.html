<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ئـاتاری شێروان - Sherwan Center</title>
<style>
  html, body {
      margin: 0;
      padding: 0;
      background: #0b0f19;
      color: #c8ced8;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
  }
  #wrap {
      text-align: center;
      padding: 20px;
  }
  #state {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
  }
  #det {
      font-size: 14px;
      color: #8b95a3;
      margin-bottom: 8px;
  }
  #cache {
      font-size: 12px;
      color: #5c6672;
  }
  .cacheok { color: #7fd0a0; }
  .bad { color: #d08a7f; }
  .warn { color: #d8c07f; }
</style>
</head>
<body>

<div id="wrap">
  <div id="state">Detecting Firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "System Firmware <b>" + (key || "Unknown") + "</b>"
        + (supported ? " &middot; <b>Supported</b>" : " &middot; Not Supported");

    var target = "jb.html" + location.search;
    function go() { setState("Running Jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("Firmware Not Supported", "bad");
        waitForTap("Press X or Tap Screen to Run Anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("Offline Mode -- Loaded from Cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("Cached Successfully", true);
        go();
    } else {
        go();
    }
})();
</script>
</body>
</html>
