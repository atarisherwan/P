<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<title>Atari Sherwan - PS4 Host</title>
<style>
  body {
      background-image: url('image.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 35vh;
      margin: 0;
      background-color: rgba(11, 15, 25, 0.8);
      background-blend-mode: overlay;
  }
  h2 { 
      font-size: 30px; 
      margin-bottom: 10px; 
      color: #fff; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
  }
  p { 
      color: #00d2ff; 
      font-size: 18px; 
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
  }
</style>
<script src="core.js"></script>
<script src="int64.js"></script>
<script src="mem.js"></script>
<script src="ps4_offsets.js"></script>
<script src="jb.js"></script>
</head>
<body>
    <h2>ئـاتاری شێروان - Sherwan Center</h2>
    <p id="msgs">Initializing 13.52 Exploit...</p>
    <script>
        function all_done() {
            document.getElementById("msgs").innerHTML = "Exploit Succeeded! Sending GoldHEN...";
            
            var req = new XMLHttpRequest();
            req.open('GET', 'goldhen.bin', true);
            req.responseType = "arraybuffer";
            
            req.onload = function () {
                if (req.status === 200) {
                    var blob = req.response;
                    var exploiter = new Uint8Array(blob);
                    
                    // ناردنی پەیلوود بۆ پۆرتی داواکراوی GoldHEN
                    if (typeof send_payload === "function") {
                        send_payload("127.0.0.1", 9020, exploiter, function() {
                            document.getElementById("msgs").innerHTML = "GoldHEN Activated Successfully!";
                        });
                    } else {
                        // ئەگەر فەنکشنی send_payload لە جەی ئێسەکەی raw13g دا بە ناوی تر بێت
                        var sock = document.createElement("script");
                        sock.src = "payload.js";
                        document.body.appendChild(sock);
                        document.getElementById("msgs").innerHTML = "GoldHEN Loaded via Payload Loader!";
                    }
                } else {
                    document.getElementById("msgs").innerHTML = "Error: Failed to load goldhen.bin payload!";
                }
            };
            
            req.onerror = function() {
                document.getElementById("msgs").innerHTML = "Network Error loading payload file.";
            };
            
            req.send();
        }

        setTimeout(function() {
            if(typeof run_jb === 'function') {
                run_jb();
            } else {
                document.getElementById("msgs").innerHTML = "Error: jb.js script not loaded properly!";
            }
        }, 1200);
    </script>
</body>
</html>
