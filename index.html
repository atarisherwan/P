<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atari Sherwan - PS4 Host</title>
<style>
  html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%;
      background-image: url('image.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      background-color: rgba(11, 15, 25, 0.85);
      background-blend-mode: overlay;
  }
  #wrap { 
      padding-top: 30vh;
  }
  h2 { 
      font-size: 30px; 
      margin-bottom: 10px; 
      color: #fff; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
  }
  #state { 
      font-size: 22px; 
      font-weight: 700; 
      margin: 0 0 6px; 
      color: #00d2ff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
  }
  #det { 
      font-size: 14px; 
      color: #8b95a3; 
      margin: 0 0 4px; 
  }
  #det b { 
      color: #c8ced8; 
      font-weight: 600; 
  }
  #cache { 
      font-size: 12px; 
      color: #5c6672; 
      margin-top: 10px; 
  }
  #cache.cacheok { 
      color: #7fd0a0; 
  }
  .ok { color: #7fd0a0; } 
  .bad { color: #d08a7f; } 
  .warn { color: #d8c07f; }
</style>
</head>
<body>
<div id="wrap">
  <h2>Atari Sherwan - Sherwan Center</h2>
  <div id="state">Checking Firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    
    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    detEl.innerHTML = "Firmware: <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <span style='color:#7fd0a0;'>Supported</span>"
                     : " &middot; <span style='color:#d08a7f;'>Unsupported</span>");

    var target = "p/jb.html" + location.search;
    function go() { 
        setState("Jailbreak started, please wait...", "warn"); 
        location.replace(target); 
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("This firmware is not supported", "bad");
        waitForTap("Press X or tap screen to bypass", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("Offline - Running from Cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("Cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Update downloaded", true);
        waitForTap("Update ready - Click to reload", function () { location.reload(); });
    } else {
        setCache("Checking cache...");
        ac.addEventListener("downloading", function () { setCache("Downloading cache for offline use..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Caching progress: " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("Cached for offline use", true);
            waitForTap("Cached successfully - Click to start", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("Update downloaded", true);
            waitForTap("Update ready - Click to reload", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("Cache is up to date", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("Cache error");
            waitForTap("Cache error - Click to continue", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("Cache obsolete");
            waitForTap("Click to start", go);
        }, false);
    }
})();
</script>
