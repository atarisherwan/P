<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<title>Atari Sherwan - PS4 Host</title>
<style>
  body {
      background-image: url('image.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 35vh;
      margin: 0;
      background-color: rgba(11, 15, 25, 0.8);
      background-blend-mode: overlay;
  }
  h2 { 
      font-size: 30px; 
      margin-bottom: 10px; 
      color: #fff; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
  }
  p { 
      color: #00d2ff; 
      font-size: 18px; 
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
  }
</style>
<script src="core.js"></script>
<script src="int64.js"></script>
<script src="mem.js"></script>
<script src="ps4_offsets.js"></script>
<script src="jb.js"></script>
</head>
<body>
    <h2>ئـاتاری شێروان - Sherwan Center</h2>
    <p id="msgs">Initializing Exploit...</p>

    <script>
        // ئەم بەشە کاتێک بانگ دەکرێت کە جیلبرەیکەکە سەرکەوتووبێت
        function all_done() {
            document.getElementById("msgs").innerHTML = "Exploit Succeeded! Loading GoldHEN...";
            
            // داگیرساندنی گولدهێن بە شێوازە ستانداردەکەی هۆستەکان
            var script = document.createElement('script');
            script.src = "goldhen.js"; // ئەگەر بە فایلی js یە، یان دەتوانیت لەگەڵ پەیلوود لۆدەر ڕێکی بخەیت
            document.body.appendChild(script);
            
            setTimeout(function() {
                document.getElementById("msgs").innerHTML = "GoldHEN Activated Successfully!";
            }, 1500);
        }

        // دەستپێکردنی کارکردنی جیلبرەیک کاتێک پەڕەکە دەکرێتەوە
        window.onload = function() {
            setTimeout(function() {
                if (typeof exploit === 'function') {
                    exploit();
                } else if (typeof run_jb === 'function') {
                    run_jb();
                } else {
                    document.getElementById("msgs").innerHTML = "Error: Exploit function not found!";
                }
            }, 1000);
        };
    </script>
</body>
</html>
